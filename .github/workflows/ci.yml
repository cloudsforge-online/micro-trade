name: CI

# Two jobs, and the split between them is a statement about micro-org rather than about this
# repository.
#
# `estate` calls the shared reusable workflow, which is where the cross-cutting rules live: one
# database per service, no cross-service source imports, /livez + /readyz + /metrics, no env_file
# fan-out, no setInterval doing domain work, and an image that starts and answers /livez. The
# measured target in docs/ecosystem/03 §5 is zero bespoke CI files, and calling it is how this
# repository counts toward that zero rather than against it.
#
# `migrate` is what the reusable workflow still does not do. `service-ci.yml` now provides a Postgres
# container and fails the build if the database suite skipped — the two gaps this file used to cover
# — so the duplicated suite run has been deleted. It ran `pnpm test` TWICE, once to test and once to
# count skips, which doubled the slowest job in the repository to answer a question the reusable
# workflow now answers for free.
#
# What remains is the one thing still unique: exercising the migrator AS a migrator, on an empty
# database, exactly as a deploy runs it. A schema created by the test suite would never prove the
# one-shot job works — and the two constraints this service exists to add only exist because it ran.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  estate:
    uses: cloudsforge-online/micro-org/.github/workflows/service-ci.yml@main
    with:
      service: trade
      database-env-var: TRADE_DATABASE_URL
      port: 4000
      # The image startup smoke test boots the real service, and `env.ts` validates its
      # configuration at import — so the container needs every variable it declares, not just a
      # database, or it exits before it serves /livez. The URLs are never dialled because /livez
      # needs no upstream, and TRADE_SERVICE_TOKEN is still a throwaway that only has to clear a
      # length check.
      #
      # OUTBOX_SIGNING_SECRET IS NO LONGER ONE OF THOSE. It is now checked by @cloudsforge/secrets,
      # which asserts the SHAPE of a generated value and has no CI exemption, so
      # `ci-only-not-a-real-secret-…` is refused here exactly as it would be in production
      # (micro-org #142). `@generate` asks service-ci.yml for a fresh `openssl rand -base64 48` per
      # run: CI does not need a WEAK secret, it needs A secret, and nothing in this smoke test
      # verifies a signature against anything else. Generated rather than committed, so this
      # repository never holds a string that looks like a key.
      smoke-env: |
        IDENTITY_JWKS_URL=http://127.0.0.1:4001/.well-known/jwks.json
        IDENTITY_ISSUER=http://127.0.0.1:4001
        OUTBOX_SIGNING_SECRET=@generate
        LEDGER_URL=http://127.0.0.1:4007
        PRICING_URL=http://127.0.0.1:4006
        BILLING_URL=http://127.0.0.1:4009
        TRADE_SERVICE_TOKEN=ci-only-not-a-real-token-0000000000000
    secrets:
      # @cloudsforge/* resolves via link:../runtime, so the workflow checks out micro-runtime
      # and micro-contracts as siblings — both private, hence a contents:read token.
      estate_token: ${{ secrets.ESTATE_READ_TOKEN }}
    permissions:
      contents: read
      packages: read

  migrate:
    name: The migrator, on an empty database
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        # Not a secret: this database exists for the duration of one job, is reachable only from it,
        # and holds nothing. A real value here would be a real value in a public log.
        env:
          POSTGRES_USER: trade
          POSTGRES_PASSWORD: trade
          POSTGRES_DB: trade_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U trade"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      # Temporary: the three checkouts and the sibling layout exist only because the runtime and
      # contracts packages are unpublished. On publish this collapses to one checkout.
      - uses: actions/checkout@v4
        with: { path: trade }
      - uses: actions/checkout@v4
        with: { repository: cloudsforge-online/micro-runtime, path: runtime, token: "${{ secrets.ESTATE_READ_TOKEN }}" }
      - uses: actions/checkout@v4
        with: { repository: cloudsforge-online/micro-contracts, path: contracts, token: "${{ secrets.ESTATE_READ_TOKEN }}" }

      - uses: pnpm/action-setup@v4
        with: { version: 11.9.0 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: trade/pnpm-lock.yaml

      - name: Install
        working-directory: trade
        run: pnpm install --frozen-lockfile

      # `src/migrator.ts` imports `src/env.ts`, so the migrator validates this environment too — and
      # OUTBOX_SIGNING_SECRET is now checked by @cloudsforge/secrets, which refuses
      # `ci-only-not-a-real-secret-…` and has no CI exemption. The `@generate` marker service-ci.yml
      # understands is a `smoke-env` feature and does NOT apply to a step's `env:` mapping, so this
      # job generates its own and hands it on through $GITHUB_ENV. Masked because a generated value
      # is still key material for the four minutes it exists; thrown away with the runner.
      - name: A real signing secret for the migrator, generated per run
        run: |
          set -euo pipefail
          secret="$(openssl rand -base64 48)"
          echo "::add-mask::${secret}"
          echo "OUTBOX_SIGNING_SECRET=${secret}" >> "$GITHUB_ENV"

      - name: Migrate the test database
        working-directory: trade
        env:
          TRADE_DATABASE_URL: postgres://trade:trade@127.0.0.1:5432/trade_test
          IDENTITY_JWKS_URL: http://127.0.0.1:4001/.well-known/jwks.json
          IDENTITY_ISSUER: http://127.0.0.1:4001
          LEDGER_URL: http://127.0.0.1:4007
          PRICING_URL: http://127.0.0.1:4006
          BILLING_URL: http://127.0.0.1:4009
          TRADE_SERVICE_TOKEN: ci-only-not-a-real-token-0000000000000
        run: pnpm migrate

      - name: Migrating twice is a no-op
        working-directory: trade
        # A deploy re-runs the one-shot job on every release. A migrator that is not idempotent
        # turns the second deploy of an unchanged schema into an outage.
        env:
          TRADE_DATABASE_URL: postgres://trade:trade@127.0.0.1:5432/trade_test
          IDENTITY_JWKS_URL: http://127.0.0.1:4001/.well-known/jwks.json
          IDENTITY_ISSUER: http://127.0.0.1:4001
          LEDGER_URL: http://127.0.0.1:4007
          PRICING_URL: http://127.0.0.1:4006
          BILLING_URL: http://127.0.0.1:4009
          TRADE_SERVICE_TOKEN: ci-only-not-a-real-token-0000000000000
        run: pnpm migrate

  rules:
    name: The two controls this service exists to add
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Asserted as text so they cannot be deleted in a refactor without a red build. The tests prove
      # they WORK; these prove they are still THERE.
      - name: The settlement and fill uniqueness constraints still exist
        run: |
          grep -q 'fee_settlements_bot_period_uniq' src/migrations.ts \
            || { echo '::error::the per-period settlement constraint is gone; performance fees can be double-billed'; exit 1; }
          grep -q 'fills_bot_bar_side_uniq' src/migrations.ts \
            || { echo '::error::the per-bar fill constraint is gone; a restart mid-tick can trade twice'; exit 1; }

      - name: The settlement key is still derived, never random
        run: |
          # Comments are stripped first — the sixth guard in this estate to fire on its own
          # rationale otherwise: every current use of the word is a comment citing the frozen
          # store.ts:452 defect this rule exists to prevent.
          scan=$(mktemp -d)
          find src -name '*.ts' ! -name '*.test.ts' -print0 | while IFS= read -r -d '' f; do
            mkdir -p "$scan/$(dirname "$f")"
            sed -e 's://.*::' "$f" | awk 'BEGIN{inb=0}{l=$0;o="";while(length(l)>0){if(inb){i=index(l,"*/");if(i==0){l="";break}inb=0;l=substr(l,i+2);continue}b=index(l,"/*");if(b>0){o=o substr(l,1,b-1);l=substr(l,b+2);inb=1;continue}o=o l;l=""}print o}' > "$scan/$f"
          done
          if grep -rn 'randomUUID' "$scan"; then
            echo '::error::a random id appears in the source. The frozen service derives its upstream'
            echo 'idempotency key from randomUUID() (crucible store.ts:452), which is what lets two'
            echo 'attempts at one settlement mint two keys. Keys here are derived from (bot, period).'
            exit 1
          fi

      - name: A backtest still answers 202 rather than running inside the request
        run: |
          grep -q 'status: 202' src/server.ts \
            || { echo '::error::the backtest route no longer answers 202; a run would die with the drain'; exit 1; }

      - name: The erasure webhook still verifies a signature
        run: |
          grep -q 'timingSafeEqual' src/server.ts \
            || { echo '::error::the event signature check is gone; POST /v1/events is a delete-anyone endpoint'; exit 1; }

      # A `*/` in the MIDDLE of a block comment terminates it early and silently uncomments whatever
      # follows. The pattern matches a continuation line of a block comment (leading `*`) that carries
      # a `*/` with more text after it — the only shape that does damage.
      - name: No comment-terminating sequence inside a block comment
        run: |
          if grep -rnE '^\s*\*.*\*/.+' src/ --include='*.ts'; then
            echo '::error::a */ appears mid-way through a block comment and terminates it early'
            exit 1
          fi

  hygiene:
    uses: cloudsforge-online/micro-org/.github/workflows/secret-hygiene.yml@main
    permissions:
      contents: read

  # ──────────────────────────────────────────────────────────────────────────────────────────────
  # THE IMAGE, PUBLISHED. `cfctl release` writes a manifest naming ghcr.io/cloudsforge-online/<repo>
  # at this repository's package.json version (micro-org tools/cfctl.ts:889-934, image name derived
  # at tools/registry.ts:367-369); `cfctl release --verify` runs `docker manifest inspect` on every
  # entry (cfctl.ts:937-975); and deploy/scripts/release-deploy.sh:99-125 refuses to change anything
  # until all of them pull. Until this job existed CI built this image and threw it away, so that
  # gate rejected every service in the estate and the manifest path could not be used at all.
  #
  # `packages: write` IS GRANTED HERE rather than asked for inside the shared CI workflow, and that
  # is forced rather than stylistic: a called workflow's GITHUB_TOKEN can only be maintained or
  # reduced, never elevated, so a reusable workflow asking for a permission its caller withheld
  # fails the whole run at STARTUP — before a step runs, on pull requests as well as on main.
  # Measured on micro-org: run 30900277471 (caller capped at `packages: read`) ended in
  # startup_failure; run 30900280323 (same workflow, caller granted `packages: write`) succeeded.
  # That is also why `push: false` is correct and stays in the shared workflow's image job — that
  # job is a GATE and needs `load:` so it can boot the image and read its health endpoint. This is
  # the producer. Different purposes, so different jobs.
  # ──────────────────────────────────────────────────────────────────────────────────────────────
  publish:
    needs: [estate, migrate, rules, hygiene]
    # A green push to main and nothing else. An image tag a release manifest pins has to name
    # something that passed, on the branch it will be deployed from.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: cloudsforge-online/micro-org/.github/workflows/publish-image.yml@main
    with:
      kind: service
    secrets:
      # The same sibling checkouts the Dockerfile's named build contexts need: the image cannot be
      # built without micro-runtime and micro-contracts beside it.
      estate_token: ${{ secrets.ESTATE_READ_TOKEN }}
    permissions:
      contents: read
      packages: write
